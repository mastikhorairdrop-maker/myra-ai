name: Build MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        id: find_dir
        run: |
          # settings.gradle या settings.gradle.kts दोनों में से जो भी हो, उसे ढूँढ लेगा
          DIR=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -maxdepth 3 -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then
            DIR="."
          fi
          echo "Using project directory: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: ${{ steps.find_dir.outputs.dir }}/app/build/outputs/apk/debug/*.apk
