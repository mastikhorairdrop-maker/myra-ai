name: Build MYRA APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Find Project
        run: |
          mkdir -p extracted_project
          unzip -o *.zip -d extracted_project
          
          # यह कमांड अपने आप ढूंढ लेगी कि gradlew फाइल कहाँ है
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in zip!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK File
        uses: actions/upload-artifact@v3
        with:
          name: myra-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
