name: Build MYRA APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip and Build APK
        run: |
          mkdir -p extracted_project
          
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Using zip file: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d extracted_project
          
          GRADLE_BUILD_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_BUILD_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: myra-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
