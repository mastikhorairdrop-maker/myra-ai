name: Build MYRA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project and Build APK
        run: |
          python3 -c '
          import os
          if not os.path.exists("app") or not os.path.exists("settings.gradle"):
              print("Creating minimal Android project...")
              os.makedirs("app/src/main/java/com/myra/ai", exist_ok=True)
              
              with open("settings.gradle", "w") as f:
                  f.write("rootProject.name = \"MYRA\"\ninclude \":app\"\n")
                  
              with open("build.gradle", "w") as f:
                  f.write("""buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """)
              
              with open("app/build.gradle", "w") as f:
                  f.write("""plugins {
              id "com.android.application"
          }
          android {
              namespace "com.myra.ai"
              compileSdk 34
              defaultConfig {
                  applicationId "com.myra.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          """)
              
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write("""<manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.myra.ai">
              <application
                  android:label="MYRA AI"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
              
              with open("app/src/main/java/com/myra/ai/MainActivity.kt", "w") as f:
                  f.write("package com.myra.ai\nimport android.app.Activity\nimport android.os.Bundle\nclass MainActivity : Activity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n    }\n}\n")
          '

          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
