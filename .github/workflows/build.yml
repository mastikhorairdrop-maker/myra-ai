name: Build MYRA APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Find Project
        run: |
          mkdir -p extracted_project
          
          # यह सिर्फ सबसे नई वाली ज़िप फाइल को चुनेगा
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Using zip file: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d extracted_project
          
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in zip!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: myra-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
